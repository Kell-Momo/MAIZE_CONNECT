services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - maize_net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maizeconnect
      POSTGRES_USER: maize_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maize_user -d maizeconnect"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - maize_net

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - maize_net

volumes:
  postgres_data:
  mongo_data:

networks:
  maize_net:
    driver: bridge
